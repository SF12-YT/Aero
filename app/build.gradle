plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sf12.f1garage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sf12.f1garage'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
