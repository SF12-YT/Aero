name: Procedural RB21 exterior preview

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/model.js"
      - "export_geometry.js"
      - "render_vtk.py"
      - ".github/workflows/model-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core xvfb
          sudo mkdir -p /mnt/data
          sudo ln -s "$GITHUB_WORKSPACE" /mnt/data/AeroLab25

      - name: Export procedural meshes
        run: node export_geometry.js | tee geometry-stats.txt

      - name: Install rendering dependencies
        run: python -m pip install --upgrade pip numpy Pillow vtk

      - name: Render orthographic previews
        run: xvfb-run -a python render_vtk.py

      - name: Upload preview images and mesh export
        uses: actions/upload-artifact@v7
        with:
          name: rb21-procedural-exterior-preview
          path: |
            rb21-vtk-iso.png
            rb21-vtk-side.png
            rb21-vtk-front.png
            rb21-vtk-top.png
            geometry-export.json
            geometry-stats.txt
          if-no-files-found: error
